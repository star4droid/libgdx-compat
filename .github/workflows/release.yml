name: Release

# Runs only when started by hand: Actions → Release → Run workflow.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version / tag to create, e.g. 1.0.1"
        required: true
        type: string
      notes:
        description: "Extra text at the top of the release notes (optional, \\n for new lines)"
        required: false
        type: string
        default: ""
      prerelease:
        description: "Mark as a pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags and history for the release notes

      - name: Validate version
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Version must look like 1.2.3 or 1.2.3-beta1, got '$VERSION'"; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::Tag $VERSION already exists"; exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" > /dev/null

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing the APK with the release key."
          else
            echo "::warning::RELEASE_KEYSTORE_BASE64 is not set: the APK is signed with a debug key."
          fi

      - name: Build library and demo APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :compat:jar :compat:sourcesJar :demo:android:assembleRelease

      - name: Collect release files
        run: |
          mkdir -p release
          cp "compat/build/libs/compat-$VERSION.jar"         "release/libgdx-compat-$VERSION.jar"
          cp "compat/build/libs/compat-$VERSION-sources.jar" "release/libgdx-compat-$VERSION-sources.jar"
          cp demo/android/build/outputs/apk/release/*.apk    "release/libgdx-compat-demo-$VERSION.apk"
          ls -l release

      - name: Write release notes
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          .github/scripts/release-notes.sh "$VERSION" "$NOTES" > release/NOTES.md
          cat release/NOTES.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "libgdx-compat $VERSION" \
            --notes-file release/NOTES.md \
            "${flags[@]}" \
            release/*.jar release/*.apk
