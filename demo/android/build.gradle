plugins { id 'com.android.application' version '8.10.1' }

android {
    namespace 'com.star4droid.compat.demo'
    compileSdk 36
    defaultConfig {
        applicationId 'com.star4droid.compat.demo'
        minSdk 21
        targetSdk 34
        // the release workflow passes these; local builds use the defaults
        versionCode((System.getenv('VERSION_CODE') ?: '1') as int)
        versionName System.getenv('VERSION') ?: '1.0.0'
    }
    signingConfigs {
        // Demo key committed to the repository on purpose: it only signs the gallery app, so every release APK
        // has the same signature and installs over the previous one. Do not reuse it for a real app.
        release {
            storeFile file('demo-release.jks')
            storePassword 'libgdxcompat'
            keyAlias 'demo'
            keyPassword 'libgdxcompat'
        }
    }
    sourceSets {
        main {
            assets.srcDirs = ['../assets']
            jniLibs.srcDirs = ['libs']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}

configurations { natives }

dependencies {
    implementation project(':demo:core')
    implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxDemoVersion"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxDemoVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxDemoVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxDemoVersion:natives-x86_64"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxDemoVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxDemoVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxDemoVersion:natives-x86_64"
}

// Unpacks the native libraries of libGDX and FreeType into libs/<abi>/ so they are packaged in the APK.
tasks.register('copyAndroidNatives') {
    doFirst {
        configurations.natives.copy().files.each { jar ->
            def abi = ['armeabi-v7a', 'arm64-v8a', 'x86_64'].find { jar.name.endsWith("natives-${it}.jar") }
            if (abi != null) {
                copy {
                    from zipTree(jar)
                    into file("libs/$abi")
                    include '*.so'
                }
            }
        }
    }
}
tasks.matching { it.name.contains('merge') && it.name.contains('JniLibFolders') }.configureEach { dependsOn 'copyAndroidNatives' }
